<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhat and Bhat Tutorials - Admin Dashboard</title>
  <link rel="icon" href="logo.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#eef3f8; color:#222; min-height:100vh; }
    
    header { background:linear-gradient(135deg,#003366,#0059b3); color:#fff; padding:20px 30px; text-align:center; box-shadow:0 4px 18px rgba(0,0,0,.20); }
    .logo { height:80px; margin-bottom:8px; }
    header h1 { font-size:32px; font-weight:700; }
    header p { font-size:16px; margin-top:4px; }
    
    .container { width:95%; max-width:1000px; margin:25px auto; padding:10px; }
    .card { background:#fff; padding:25px; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,0.08); margin-bottom:25px; }
    .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:2px solid #eef3f8; padding-bottom:10px; }
    .nav-btn { background:#003366; color:#fff; text-decoration:none; padding:8px 14px; border-radius:6px; font-weight:bold; font-size:13px; cursor:pointer; border:none; }
    
    h2 { color:#003366; font-size:20px; margin-bottom:15px; }
    .form-group { margin-bottom:14px; }
    label { font-weight:bold; font-size:13px; display:block; margin-bottom:4px; color:#003366; }
    input, select { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    
    .submit-btn { background:#003366; color:white; border:none; padding:12px; font-size:15px; font-weight:bold; width:100%; cursor:pointer; border-radius:6px; margin-top:10px; }
    .submit-btn:hover { background:#0059b3; }
    
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <img src="logo.png" class="logo" alt="Bhat and Bhat Tutorials Logo">
  <h1>Bhat and Bhat Tutorials</h1>
  <p><i>"Where Students Achieve Success"</i></p>
</header>

<div class="container">
  <div class="card">
    <div class="header-bar">
      <a href="index.html" class="nav-btn">← Main LMS Portal</a>
      <span id="userInfo" style="font-weight:bold; color:#003366;"></span>
      <button onclick="logout()" class="nav-btn" style="background:#c62828;">Logout</button>
    </div>

    <!-- 1. STUDENT RECORD DATABASE ENTRY (Both Roles) -->
    <h2>📥 Student Database Entry</h2>
    <div class="form-group"><label>SRN Number:</label><input type="text" id="srn" placeholder="SRN1024"></div>
    <div class="form-group"><label>Student Name:</label><input type="text" id="student_name" placeholder="Full Name"></div>
    <div class="form-group"><label>D.O.B (DD-MM-YYYY):</label><input type="text" id="dob" placeholder="DD-MM-YYYY"></div>
    
    <div class="form-group grid">
      <div><label>Class:</label><input type="text" id="class_name" placeholder="10th"></div>
      <div><label>Board Type:</label><input type="text" id="board_type" placeholder="CBSE"></div>
    </div>
    
    <div class="form-group grid">
      <div><label>Section:</label><input type="text" id="section" placeholder="A"></div>
      <div><label>Batch Type:</label><input type="text" id="batch_type" placeholder="Regular"></div>
    </div>
    
    <div class="form-group"><label>Subjects Opted:</label><input type="text" id="subjects_opted" placeholder="Physics, Chemistry"></div>
    <div class="form-group"><label>Student Mobile:</label><input type="text" id="student_mobile" placeholder="Mobile Number"></div>
    
    <div class="form-group grid">
      <div><label>Father Name:</label><input type="text" id="father_name" placeholder="Father Name"></div>
      <div><label>Father Contact:</label><input type="text" id="father_contact" placeholder="Father Contact Number"></div>
    </div>
    
    <button class="submit-btn" onclick="saveStudent()">Save / Sync Student Record</button>
    <div id="studentMsg" style="margin-top:10px; font-weight:bold; text-align:center;"></div>
  </div>

  <!-- SUPER ADMIN ONLY SECTION -->
  <div id="superAdminSection" style="display:none;">
    
    <!-- 2. CREATE NEW ADMIN PANEL -->
    <div class="card">
      <h2>🛡️ Add New Admin User (Super Admin)</h2>
      <div class="form-group"><label>Admin Name:</label><input type="text" id="newAdminName"></div>
      <div class="form-group"><label>Admin Email:</label><input type="email" id="newAdminEmail"></div>
      <div class="form-group"><label>Password:</label><input type="password" id="newAdminPassword"></div>
      <div class="form-group">
        <label>Role:</label>
        <select id="newAdminRole">
          <option value="admin">Admin</option>
          <option value="superadmin">Super Admin</option>
        </select>
      </div>
      <button class="submit-btn" onclick="addAdmin()" style="background:#2e7d32;">Create Admin User</button>
      <div id="adminMsg" style="margin-top:10px; font-weight:bold; text-align:center;"></div>
    </div>

    <!-- 3. ADD SUBJECT & COURSE -->
    <div class="card">
      <h2>📚 Add Subject / Course Section</h2>
      <div class="form-group"><label>Class / Course Name:</label><input type="text" id="courseClass" placeholder="e.g. Class 10 CBSE"></div>
      <div class="form-group"><label>Subject Name:</label><input type="text" id="courseSubject" placeholder="e.g. Mathematics"></div>
      <button class="submit-btn" onclick="addCourse()" style="background:#0277bd;">Add Subject to Course</button>
    </div>

    <!-- 4. UPLOAD STUDY NOTES / PDF LINKS -->
    <div class="card">
      <h2>📘 Upload Study Material / Notes Link</h2>
      <div class="form-group"><label>Material Title:</label><input type="text" placeholder="e.g. Physics Chapter 1 Notes"></div>
      <div class="form-group"><label>Google Drive PDF File ID:</label><input type="text" placeholder="File ID from Drive Link"></div>
      <button class="submit-btn" style="background:#ef6c00;">Publish Note to Main LMS</button>
    </div>

  </div>
</div>

<script>
  const WORKER_URL = "https://steep-wind-e204.bhatandbhat.workers.dev";
  const role = localStorage.getItem("userRole");
  const userName = localStorage.getItem("userName");

  // Protect Dashboard Access
  if (!role) {
    alert("Unauthorized access! Please login first.");
    window.location.href = "index.html";
  } else {
    document.getElementById("userInfo").innerHTML = `${userName} (${role.toUpperCase()})`;
    if (role === "superadmin") {
      document.getElementById("superAdminSection").style.display = "block";
    }
  }

  function logout() {
    localStorage.clear();
    window.location.href = "index.html";
  }

  async function saveStudent() {
    const payload = {
      srn: document.getElementById('srn').value.trim(),
      student_name: document.getElementById('student_name').value.trim(),
      dob: document.getElementById('dob').value.trim(),
      class_name: document.getElementById('class_name').value.trim(),
      board_type: document.getElementById('board_type').value.trim(),
      section: document.getElementById('section').value.trim(),
      batch_type: document.getElementById('batch_type').value.trim(),
      subjects_opted: document.getElementById('subjects_opted').value.trim(),
      student_mobile: document.getElementById('student_mobile').value.trim(),
      father_name: document.getElementById('father_name').value.trim(),
      father_contact: document.getElementById('father_contact').value.trim()
    };

    const res = await fetch(`${WORKER_URL}/api/students/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    document.getElementById("studentMsg").innerHTML = data.success ? "✅ Saved!" : "❌ Error";
  }

  async function addAdmin() {
    const payload = {
      name: document.getElementById('newAdminName').value.trim(),
      email: document.getElementById('newAdminEmail').value.trim(),
      password: document.getElementById('newAdminPassword').value.trim(),
      role: document.getElementById('newAdminRole').value
    };

    const res = await fetch(`${WORKER_URL}/api/admin/add`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    document.getElementById("adminMsg").innerHTML = data.success ? "✅ Admin Created!" : "❌ " + data.message;
  }
</script>

</body>
</html>
